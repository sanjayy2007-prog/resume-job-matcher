<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Job Matcher</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .upload-box {
            border: 2px dashed #999;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 12px;
        }

        input[type="file"] {
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .or {
            text-align: center;
            font-weight: bold;
            margin: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Resume Job Matcher</h1>
        <p>AI-powered Resume and Job Description Matching</p>
    </div>

    <div class="container">

        <div class="card">

            <form action="/analyze"
                  method="POST"
                  enctype="multipart/form-data">

                <!-- Resume -->

                <div class="upload-box">

                    <label>
                        📄 Upload Resume (PDF)
                    </label>

                    <input
                        type="file"
                        name="resume"
                        accept=".pdf"
                        required
                    >

                </div>


                <!-- Job Description Text -->

                <div class="upload-box">

                    <label>
                        📋 Paste Job Description
                    </label>

                    <textarea
                        name="job_description_text"
                        placeholder="Paste Job Description here..."
                    ></textarea>

                </div>


                <div class="or">
                    OR
                </div>


                <!-- Job Description PDF -->

                <div class="upload-box">

                    <label>
                        📄 Upload Job Description (PDF)
                    </label>

                    <input
                        type="file"
                        name="job_description_pdf"
                        accept=".pdf"
                    >

                </div>


                <!-- Analyze -->

                <button type="submit">
                    🔍 Analyze Resume
                </button>

            </form>

        </div>

    </div>

</body>
</html>
