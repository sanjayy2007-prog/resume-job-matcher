<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Job Matcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            color: #d1d5db;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .upload-box {
            border: 2px dashed #9ca3af;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .upload-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 12px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            resize: vertical;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        .or {
            text-align: center;
            font-weight: bold;
            color: #6b7280;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .info {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>Resume Job Matcher</h1>

        <p>
            AI-powered Resume and Job Description Matching
        </p>

    </div>


    <div class="container">

        <div class="card">

            <div class="section-title">
                Upload Your Resume
            </div>


            <form action="/analyze" method="POST" enctype="multipart/form-data">

                <div class="upload-box">

                    <label>
                        📄 Resume (PDF)
                    </label>

                    <input
                        type="file"
                        name="resume"
                        accept=".pdf"
                        required
                    >

                </div>


                <div class="upload-box">

                    <label>
                        📋 Paste Job Description
                    </label>

                    <textarea
                        name="job_description_text"
                        placeholder="Paste the job description here..."
                    ></textarea>

                </div>


                <div class="or">
                    OR
                </div>


                <div class="upload-box">

                    <label>
                        📄 Upload Job Description (PDF)
                    </label>

                    <input
                        type="file"
                        name="job_description_pdf"
                        accept=".pdf"
                    >

                </div>


                <button type="submit">
                    🔍 Analyze Resume
                </button>

            </form>


            <div class="info">

                You can either paste the Job Description
                or upload it as a PDF.

            </div>

        </div>

    </div>

</body>

</html>
