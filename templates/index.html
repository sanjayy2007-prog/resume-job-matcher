<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Job Matcher</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 700px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #aaa;
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        input[type="file"] {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Resume Job Matcher</h1>

        <p class="subtitle">
            Upload your resume and job description to check the match.
        </p>

        <form action="/analyze" method="POST" enctype="multipart/form-data">

            <div class="upload-box">
                <label>Upload Resume (PDF)</label>

                <input type="file"
                       name="resume"
                       accept=".pdf"
                       required>
            </div>

            <div class="upload-box">
                <label>Upload Job Description</label>

                <input type="file"
                       name="job_description"
                       accept=".txt"
                       required>
            </div>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>

</body>

</html>
